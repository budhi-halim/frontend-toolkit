name: Deploy release website
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate stable tag syntax
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'if(!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG))process.exit(1)'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'if(process.env.RELEASE_TAG!=="v"+JSON.parse(require("fs").readFileSync("package.json","utf8")).version)process.exit(1)'
      - run: npm ci
      - run: npm run verify
      - run: npm run check:release
      - run: npm run build
      - run: node scripts/git-generated.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/production_test.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy the tested release website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
